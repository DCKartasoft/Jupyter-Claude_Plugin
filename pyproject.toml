[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.0.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyter-claude-plugin"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jupyter_server>=2.4.0,<3",
    "claude-agent-sdk>=0.1",
    "jupyter-mcp-server>=1.0",
]
dynamic = ["version", "description", "authors", "keywords"]

[project.urls]
Homepage = "https://github.com/DCKartasoft/Jupyter-Claude_Plugin"
Documentation = "https://github.com/DCKartasoft/Jupyter-Claude_Plugin/blob/main/docs/USER_GUIDE.md"
Repository = "https://github.com/DCKartasoft/Jupyter-Claude_Plugin"
Issues = "https://github.com/DCKartasoft/Jupyter-Claude_Plugin/issues"
Changelog = "https://github.com/DCKartasoft/Jupyter-Claude_Plugin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.0.0",
]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_claude/labextension"]
exclude = [".github", "binder", ".claude"]

[tool.hatch.build.targets.wheel]
packages = ["jupyter_claude"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_claude/labextension" = "share/jupyter/labextensions/@dckartasoft/jupyter-claude"
"install.json" = "share/jupyter/labextensions/@dckartasoft/jupyter-claude/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyter_claude/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_claude/labextension/static/style.js",
    "jupyter_claude/labextension/package.json",
]
skip-if-exists = ["jupyter_claude/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyter_claude/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.0.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
